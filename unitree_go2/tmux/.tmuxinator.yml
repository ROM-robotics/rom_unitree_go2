# ./.tmuxinator.yml

name: ROM_02_EKF 
root: ~/

pre_window: export PS1=" \[$(tput sgr0)\]\[$(tput bold)\]\[\033[38;5;45m\]>>>\[$(tput sgr0)\] \[$(tput sgr0)\]"

# USE ROM_ROBOT_MODEL as ( bobo | yoyo | rom2109 ) in BASHRC

startup_window: Main
# startup_pane: 0

windows:
  - Main: 
      root: ~/
      panes:
        - clear; source /home/mr_robot/data/systemd/.rom_environment.sh; source /tmp/docker_init.sh; ros2 launch ${ROM_ROBOT_MODEL}_ekf ekf.launch.py publish_tf:=True use_sim_time:=True
  - SubscriberLists: 
      root: ~/
      panes:
        - clear; sleep 6; source /home/mr_robot/data/systemd/.rom_environment.sh; source /tmp/docker_init.sh; ros2 topic subscribers_list
  - PublisherLists: 
      root: ~/
      panes:
        - clear; sleep 6; source /home/mr_robot/data/systemd/.rom_environment.sh; source /tmp/docker_init.sh; ros2 topic publishers_list
  - DanglerOrphans: 
      root: ~/
      panes:
        - clear; sleep 6; source /home/mr_robot/data/systemd/.rom_environment.sh; source /tmp/docker_init.sh; ros2 topic leaf_topics_list